command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Recon output location (where Lakebridge reconcile wrote main/metrics/details).
  - name: RCA_RECON_CATALOG
    value: "fevm_ps_dr_us_east_2_catalog"
  - name: RCA_RECON_SCHEMA
    value: "reconcile"
  - name: RCA_DIALECT
    value: "snowflake"

  # Code-aware RCA: migrated (transpiled) SQL artifact so App findings carry the
  # 🔧 Transformation logic + culprit. Default points at the hybrid retail demo bed.
  - name: RCA_TRANSPILED_OUTPUT_DIR
    value: "/Workspace/Users/ankita.darekar@databricks.com/.assistant/skills/rca-recon/demo_artifacts/hybrid"

  # Default source/target schemas prefilled in the "Trigger recon" form. The app
  # writes new recon runs into RCA_RECON_CATALOG.RCA_RECON_SCHEMA, so the SP needs
  # SELECT on these schemas and MODIFY on the reconcile schema.
  - name: RCA_SOURCE_SCHEMA
    value: "mig_source_sim"
  - name: RCA_TARGET_SCHEMA
    value: "mig_target"

  # SQL warehouse used for live discovery + per-table RCA. The app's service
  # principal needs "Can use" on this warehouse and SELECT on the recon +
  # source/target schemas.
  - name: RCA_WAREHOUSE_ID
    value: "4c79c6902dd2bbc2"

  # Writable scratch dir for freshly-analyzed table bundles (the app source path
  # is read-only). Unset here so it defaults to the committed app/bundles/ — which now
  # holds REAL RCA bundles for every recon (Migration Health + per-recon dashboards read
  # these). Per-table on-demand analysis is off (RCA_ALLOW_ONDEMAND=false), so no writes.
  # - name: RCA_BUNDLES_DIR
  #   value: "/tmp/rca_bundles"

  # Per-table analysis runs live with just the warehouse set (fast, ~5s/table).
  # Set to "true" to also let the run dashboard compute a full run on load
  # (slower for large runs); off keeps the app snappy on the one-table flow.
  - name: RCA_ALLOW_ONDEMAND
    value: "false"

  # Validation-tool-agnostic ingest. "lakebridge" (default) analyzes reconcile main/metrics/
  # details; "avf" analyzes the Auto Validation Framework avf_* report tables for a run_id.
  # Switching the tool changes only ingest — the engine, bundles, dashboards, and notebook are
  # identical, and the Lakebridge path is unchanged. For AVF set RCA_AVF_REPORTS_SCHEMA to the
  # catalog.schema holding the avf_* tables (defaults to RCA_RECON_CATALOG.RCA_RECON_SCHEMA).
  - name: RCA_VALIDATION_TOOL
    value: "lakebridge"
  - name: RCA_AVF_REPORTS_SCHEMA
    value: ""
  - name: RCA_AVF_CONSUME_RCA
    value: "true"

  # Workspace folder the "Run full RCA" action publishes generated notebooks into.
  # The app's service principal needs write (CAN_MANAGE) on this folder.
  - name: RCA_NOTEBOOK_DIR
    value: "/Workspace/Users/ankita.darekar@databricks.com/rca_notebooks"

  # Append-only audit trail: each reconcile/RCA step logs one row here (grouped by
  # run_id). Defaults to <RCA_RECON_CATALOG>.<RCA_RECON_SCHEMA>.rca_genie_audit when
  # unset; set a fully-qualified name to relocate, or "off" to disable. The SP needs
  # CREATE TABLE + MODIFY on the containing schema (the table is auto-created).
  - name: RCA_AUDIT_TABLE
    value: "fevm_ps_dr_us_east_2_catalog.reconcile.rca_genie_audit"

  # Tier-2 LLM fallback: after the deterministic pass, ask a Foundation Model
  # serving endpoint to resolve residual (needs-review/unknown) findings — it
  # proposes a cause + a confirming SQL query, which the engine runs and promotes
  # ONLY if the query confirms (never a bare LLM guess). The SP needs "Can Query"
  # on the endpoint. Set RCA_LLM_FALLBACK to "false" to disable.
  - name: RCA_LLM_FALLBACK
    value: "true"
  - name: RCA_LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"

  # Invoke the Genie Code skill as a Databricks Job (serverless) so the skill's own
  # code does ALL actions (reconcile + RCA + notebook publish + audit); the app just
  # submits the run, polls it, and reads the bundle back. Set RCA_USE_SKILL_JOB to
  # "false" to fall back to the in-process engine path.
  #   RCA_SKILL_DIR      = workspace folder of the deployed skill (contains scripts/, config.yml)
  #   RCA_SKILL_NOTEBOOK = the skill's job_entry notebook (imported from scripts/job_entry.py)
  #   RCA_SKILL_OUT_DIR  = workspace base the skill job writes rca_<id>/ bundles + notebooks into
  # The app's service principal needs: CAN_RUN on jobs + serverless, CAN_READ on the
  # skill dir, CAN_MANAGE on the out dir.
  - name: RCA_USE_SKILL_JOB
    value: "true"
  - name: RCA_SKILL_DIR
    value: "/Workspace/Users/ankita.darekar@databricks.com/rca-recon-skill"
  - name: RCA_SKILL_NOTEBOOK
    value: "/Workspace/Users/ankita.darekar@databricks.com/rca-recon-skill/scripts/job_entry"
  - name: RCA_SKILL_OUT_DIR
    value: "/Workspace/Users/ankita.darekar@databricks.com/rca_skill_out"

  # Real Lakebridge reconcile: when on, the "Trigger recon" flow submits the deployed
  # LAKEBRIDGE_Reconciliation_Runner job (databricks_labs_lakebridge `reconcile`) instead of
  # the app-native reconcile, then RCAs the recon_id it writes. Lakebridge reads its own
  # .lakebridge/reconcile.yml + recon_config_*.json for which tables to compare. The app's
  # service principal needs CAN_MANAGE_RUN on the job. Set RCA_USE_LAKEBRIDGE_RECON=false to
  # fall back to the app-native (or skill-job) reconcile.
  # Code-aware TARGET transform: auto-discover the building job's SQL from
  # system.access.table_lineage (no scripts to pass); falls back to RCA_TRANSPILED_OUTPUT_DIR
  # when no building job is found. Source side needs no script (values from recon details,
  # types from schema_details).
  - name: RCA_TRACE_JOB
    value: "true"

  - name: RCA_USE_LAKEBRIDGE_RECON
    value: "true"
  - name: RCA_LAKEBRIDGE_JOB_ID
    value: "1047932225626358"
  - name: RCA_LAKEBRIDGE_INSTALL_FOLDER
    value: "/Users/ankita.darekar@databricks.com/.lakebridge"
