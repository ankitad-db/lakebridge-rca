dialect: mssql

# SQL Server (T-SQL) -> Databricks type mapping guidance. `risk` flags mappings
# that commonly cause reconciliation mismatches if done incorrectly.
type_mappings:
  - source: DECIMAL(p,s) / NUMERIC(p,s)
    databricks: DECIMAL(p,s)
    risk: high
    note: Mapping to DOUBLE/FLOAT loses precision and causes rounding drift. Preserve precision/scale.
  - source: MONEY / SMALLMONEY
    databricks: DECIMAL(19,4)
    risk: high
    note: MONEY is a scaled integer (4 dp); mapping to DOUBLE rounds. Use DECIMAL(19,4).
  - source: DATETIME
    databricks: TIMESTAMP
    risk: high
    note: "DATETIME rounds to 1/300s (~3.33 ms) increments, so values can differ from an exact TIMESTAMP; DATETIME2 is exact."
  - source: DATETIMEOFFSET
    databricks: TIMESTAMP
    risk: high
    note: Carries a tz offset; Databricks TIMESTAMP is UTC. Convert deterministically or values shift.
  - source: BIT
    databricks: BOOLEAN
    risk: medium
    note: Stored as 0/1; map explicitly so NULL/0/1 don't become string '0'/'1'.
  - source: CHAR(n) / NCHAR(n) / VARCHAR / NVARCHAR
    databricks: STRING
    risk: high
    note: "Default collation is usually case-insensitive (CI) and CHAR(n) is blank-padded; Spark STRING is case-sensitive and unpadded."
  - source: UNIQUEIDENTIFIER
    databricks: STRING
    risk: medium
    note: GUID casing/format (braces, upper/lower) can differ; normalize before comparing.
  - source: FLOAT / REAL
    databricks: DOUBLE
    risk: medium
    note: Aggregation ordering can produce tiny differences on doubles.
  - source: VARBINARY / IMAGE
    databricks: BINARY
    risk: medium
    note: Hex (0x...) vs binary serialization differs; compare decoded bytes.

# Functions / constructs whose semantics differ between T-SQL and Spark SQL.
function_diffs:
  - function: default CI collation comparison
    category: string_format
    note: T-SQL string equality/joins are case-insensitive under a CI collation; Spark is case-sensitive, so joins and GROUP BY can bucket differently.
  - function: GETDATE / SYSDATETIME
    category: transpilation
    note: Server-local vs UTC (SYSUTCDATETIME) and DATETIME rounding; align to a single tz and precision.
  - function: ISNULL / COALESCE
    category: null_boolean
    note: ISNULL returns the type of the first arg (can truncate); COALESCE uses type precedence. Behavior can differ after transpile.
  - function: "+ string concatenation"
    category: null_boolean
    note: With CONCAT_NULL_YIELDS_NULL, '+' propagates NULL; CONCAT() ignores NULL. Verify which the transform used.
  - function: DATEADD / DATEDIFF / DATEPART
    category: transpilation
    note: Unit names, week-start (DATEFIRST/@@DATEFIRST), and boundary counting differ from Spark date functions.
  - function: CONVERT / CAST with style
    category: transpilation
    note: T-SQL CONVERT style codes for dates/money differ from Spark patterns; parsing/formatting can diverge.
  - function: integer division ( / )
    category: transpilation
    note: int / int truncates in T-SQL; verify Spark casts and truncation match.
  - function: TOP / OFFSET-FETCH
    category: transpilation
    note: Row-limiting without a deterministic ORDER BY can select different rows after translation.

# Remediation templates keyed by RootCauseCategory value.
remediation:
  type_precision: >-
    Re-map DECIMAL/NUMERIC(p,s) and MONEY to a Databricks DECIMAL(p,s) (MONEY -> DECIMAL(19,4)) that
    preserves precision/scale instead of DOUBLE/FLOAT, then reload the affected column.
  timezone: >-
    Normalize timestamps explicitly (convert DATETIMEOFFSET / server-local GETDATE to UTC), and note
    DATETIME's ~3.33 ms rounding — prefer DATETIME2 -> TIMESTAMP for exact values.
  semi_structured: >-
    Compare parsed JSON/XML values rather than raw text; if semantically equal, treat as benign or
    canonicalize (sorted keys) before reconciling.
  string_format: >-
    Account for the case-insensitive default collation and CHAR(n) blank-padding: TRIM and normalize
    case in the transform (or align collation) so joins/aggregations match.
  transpilation: >-
    Fix the translated SQL to match T-SQL semantics (ISNULL vs COALESCE typing, DATEADD/DATEDIFF and
    week-start, CONVERT style codes, integer division, TOP ordering), then re-run the transform.
  volume_missing: >-
    Investigate the load filter/watermark (and TOP/OFFSET limits that don't translate deterministically);
    back-fill filtered/late rows and make the incremental load idempotent.
  volume_extra: >-
    Fix the fan-out join or add de-duplication; ensure the load is idempotent so re-runs do not
    duplicate rows.
  upstream_drift: >-
    Not a migration defect. Align source/target snapshot times or route to the data owner; the
    source data itself changed or was not populated.
  null_boolean: >-
    Map BIT (0/1) to BOOLEAN and resolve ISNULL/COALESCE and '+' vs CONCAT null handling explicitly to
    Databricks NULL semantics.
  env_config: >-
    Align session settings (timezone, DATEFIRST, collation, ANSI_NULLS/CONCAT_NULL_YIELDS_NULL)
    between the reconciliation runs.
  recon_config: >-
    Review the reconcile configuration (join keys, transformations, tolerance thresholds).
