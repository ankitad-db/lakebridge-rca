dialect: teradata

# Teradata -> Databricks type mapping guidance. `risk` flags mappings that
# commonly cause reconciliation mismatches if done incorrectly.
type_mappings:
  - source: DECIMAL(p,s) / NUMBER(p,s)
    databricks: DECIMAL(p,s)
    risk: high
    note: Mapping to DOUBLE/FLOAT loses precision and causes rounding drift. Preserve precision/scale.
  - source: BYTEINT
    databricks: TINYINT
    risk: low
    note: 8-bit integer; ensure signedness/range preserved.
  - source: CHAR(n) / VARCHAR(n)
    databricks: STRING
    risk: high
    note: "CHAR(n) is blank-padded and the default NOT CASESPECIFIC collation makes comparisons case-insensitive; Spark STRING is case-sensitive and unpadded."
  - source: TIMESTAMP(6) / TIMESTAMP WITH TIME ZONE
    databricks: TIMESTAMP
    risk: high
    note: Microsecond precision and stored tz offset; Databricks TIMESTAMP is UTC microsecond. Normalize tz explicitly.
  - source: PERIOD(DATE) / PERIOD(TIMESTAMP)
    databricks: two columns (begin/end) or STRUCT
    risk: high
    note: No native Period type; must be decomposed. Bound semantics (inclusive/exclusive end) differ.
  - source: NUMBER (unconstrained)
    databricks: DECIMAL(38,x) or DOUBLE
    risk: high
    note: Floating scale; choosing a fixed scale truncates or rounds. Pick scale from the data.
  - source: FLOAT / REAL / DOUBLE PRECISION
    databricks: DOUBLE
    risk: medium
    note: Aggregation ordering can produce tiny differences on doubles.
  - source: BLOB / BYTE / VARBYTE
    databricks: BINARY
    risk: medium
    note: Hex vs binary serialization differs; compare decoded bytes.

# Functions / constructs whose semantics differ between Teradata and Spark SQL.
function_diffs:
  - function: default NOT CASESPECIFIC comparison
    category: string_format
    note: Teradata string equality/joins are case-insensitive by default; Spark is case-sensitive, so joins and GROUP BY can bucket differently.
  - function: QUALIFY
    category: transpilation
    note: Translated to a windowed subquery/filter; tie-breaking and ROW_NUMBER ordering must match or different rows survive.
  - function: trailing spaces in CHAR
    category: string_format
    note: Teradata often ignores trailing blanks in comparisons; Spark does not. TRIM to align.
  - function: integer division ( / )
    category: transpilation
    note: Integer / integer truncates in Teradata; verify Spark casts and truncation match.
  - function: ADD_MONTHS / date arithmetic
    category: transpilation
    note: End-of-month and interval handling differ from Spark date math.
  - function: CAST with format / FORMAT phrase
    category: transpilation
    note: Teradata FORMAT and implicit CAST rules differ from Spark; formatting/parsing can diverge.
  - function: SUBSTR / INDEX (1-based)
    category: transpilation
    note: 1-based indexing with distinct empty/negative handling; validate off-by-one.
  - function: NULLIFZERO / ZEROIFNULL
    category: null_boolean
    note: Teradata-specific null/zero helpers; map explicitly to nullif/coalesce.

# Remediation templates keyed by RootCauseCategory value.
remediation:
  type_precision: >-
    Re-map Teradata DECIMAL/NUMBER(p,s) to a Databricks DECIMAL(p,s) that preserves precision and
    scale (pick a scale for unconstrained NUMBER) instead of DOUBLE/FLOAT, then reload the column.
  timezone: >-
    Normalize timestamps explicitly during load (convert TIMESTAMP WITH TIME ZONE to UTC) and keep
    microsecond precision consistent on both sides.
  semi_structured: >-
    Compare parsed JSON/structured values rather than raw text; if semantically equal, treat as
    benign or canonicalize before reconciling.
  string_format: >-
    Account for Teradata's default case-insensitive (NOT CASESPECIFIC) collation and CHAR(n) trailing
    blanks: TRIM and normalize case in the transform (or align collation) so joins/aggregations match.
  transpilation: >-
    Fix the translated SQL to match Teradata semantics (QUALIFY tie-breaking, integer division,
    1-based SUBSTR/INDEX, FORMAT/CAST rules, date arithmetic), then re-run the transform.
  volume_missing: >-
    Investigate the load filter/watermark; back-fill late-arriving or filtered rows and make the
    incremental load idempotent.
  volume_extra: >-
    Fix the fan-out join or add de-duplication (watch MULTISET tables allowing duplicates); ensure
    the load is idempotent so re-runs do not duplicate rows.
  upstream_drift: >-
    Not a migration defect. Align source/target snapshot times or route to the data owner; the
    source data itself changed or was not populated.
  null_boolean: >-
    Map Teradata NULLIFZERO/ZEROIFNULL and any 'Y'/'N' or 1/0 flags explicitly to Databricks
    NULL/BOOLEAN.
  env_config: >-
    Align session settings (timezone, collation/CASESPECIFIC, date format) between the reconciliation
    runs.
  recon_config: >-
    Review the reconcile configuration (join keys, transformations, tolerance thresholds).
