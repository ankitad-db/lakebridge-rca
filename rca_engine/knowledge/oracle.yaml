dialect: oracle

# Oracle -> Databricks type mapping guidance. `risk` flags mappings that
# commonly cause reconciliation mismatches if done incorrectly.
type_mappings:
  - source: NUMBER(p,s)
    databricks: DECIMAL(p,s)
    risk: high
    note: Mapping to DOUBLE/FLOAT loses precision and causes rounding drift. Preserve precision/scale.
  - source: NUMBER (no precision/scale)
    databricks: DECIMAL(38,x) or DOUBLE
    risk: high
    note: Unconstrained NUMBER holds up to 38 digits with a floating scale; picking a fixed scale truncates or rounds. Choose scale from the data.
  - source: DATE
    databricks: TIMESTAMP
    risk: high
    note: Oracle DATE includes a time component (to the second). Mapping to Databricks DATE drops the time and shifts day-grain aggregations.
  - source: TIMESTAMP WITH TIME ZONE / WITH LOCAL TIME ZONE
    databricks: TIMESTAMP
    risk: high
    note: Session/stored offset is tz-relative; Databricks TIMESTAMP is UTC. Normalize explicitly or values shift by an offset.
  - source: VARCHAR2 / CHAR(n) / NVARCHAR2
    databricks: STRING
    risk: high
    note: "Oracle treats '' as NULL, so empty strings collapse to NULL; CHAR(n) is blank-padded. Case/collation can differ."
  - source: CLOB / NCLOB / LONG
    databricks: STRING
    risk: medium
    note: Large-object encoding and trailing whitespace can differ; compare trimmed/normalized text.
  - source: BLOB / RAW
    databricks: BINARY
    risk: medium
    note: Hex vs binary serialization differs; compare decoded bytes.
  - source: FLOAT / BINARY_DOUBLE / BINARY_FLOAT
    databricks: DOUBLE
    risk: medium
    note: Aggregation ordering can produce tiny differences on doubles.

# Functions / constructs whose semantics differ between Oracle and Spark SQL.
function_diffs:
  - function: NVL / NVL2
    category: null_boolean
    note: Maps to coalesce/if; watch Oracle's empty-string-is-NULL rule which changes which branch fires.
  - function: DECODE
    category: transpilation
    note: Translated to CASE; NULL comparison semantics in DECODE (NULL matches NULL) differ from CASE equality.
  - function: TRUNC(date)
    category: transpilation
    note: TRUNC on a DATE zeroes the time; if the target keeps time or uses date_trunc with a different unit, day buckets shift.
  - function: TO_DATE / TO_CHAR (format masks)
    category: transpilation
    note: Oracle format models (e.g. 'DD-MON-YYYY', NLS-dependent) differ from Spark patterns; parsing/formatting can diverge.
  - function: ROWNUM / ROWID
    category: transpilation
    note: No Spark equivalent; row-limiting/ordering must be reworked with window functions and can change which rows survive.
  - function: instr / substr (1-based)
    category: transpilation
    note: Oracle string indexing is 1-based with distinct empty/negative handling; validate off-by-one and empty inputs.
  - function: MONTHS_BETWEEN / ADD_MONTHS
    category: transpilation
    note: Fractional-month and end-of-month rules differ from Spark date math.
  - function: "|| concatenation with NULL"
    category: null_boolean
    note: Oracle ignores NULL in concatenation (NULL acts as ''); Spark propagates NULL unless coalesced.

# Remediation templates keyed by RootCauseCategory value.
remediation:
  type_precision: >-
    Re-map Oracle NUMBER(p,s) to a Databricks DECIMAL(p,s) that preserves precision and scale
    (for unconstrained NUMBER, pick a scale from the data profile) instead of DOUBLE/FLOAT, then
    reload the affected column.
  timezone: >-
    Normalize timestamps explicitly during load (convert TIMESTAMP WITH [LOCAL] TIME ZONE to UTC)
    and preserve Oracle DATE's time component by mapping DATE -> TIMESTAMP, not DATE.
  semi_structured: >-
    Compare parsed values rather than raw serialized text (XMLTYPE/JSON); if payloads are
    semantically equal, treat as benign or add a canonicalization step before reconciling.
  string_format: >-
    Account for Oracle empty-string = NULL and CHAR(n) blank-padding: TRIM and normalize case/Unicode
    in the transform, or align collation; if purely cosmetic, adjust the recon transformation/tolerance.
  transpilation: >-
    Fix the translated SQL to match Oracle semantics (DECODE/NVL null handling, TRUNC(date) buckets,
    TO_DATE/TO_CHAR format masks, 1-based INSTR/SUBSTR, ROWNUM->window), then re-run the transform.
  volume_missing: >-
    Investigate the load filter/watermark (and ROWNUM-based limits that don't translate); back-fill
    late-arriving or filtered rows and make the incremental load idempotent.
  volume_extra: >-
    Fix the fan-out join or add de-duplication; ensure the load is idempotent so re-runs do not
    duplicate rows.
  upstream_drift: >-
    Not a migration defect. Align source/target snapshot times or route to the data owner; the
    source data itself changed or was not populated.
  null_boolean: >-
    Handle Oracle's empty-string = NULL and NVL/DECODE/|| null semantics explicitly, and map any
    'Y'/'N' or 1/0 flags to Databricks NULL/BOOLEAN.
  env_config: >-
    Align session settings (NLS timezone, date/number format, sort/collation, ANSI mode) between the
    reconciliation runs.
  recon_config: >-
    Review the reconcile configuration (join keys, transformations, tolerance thresholds).
