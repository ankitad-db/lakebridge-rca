# Ground-truth oracle for the DEMO PAYMENTS bed.
#
# One recon run: payments_src -> payments_gold (join payment_id).
# Two findings that deliberately exercise the TWO tiers:
#   PT1  payment_ts  -> Tier 1 deterministic (timezone probe fingerprints the +5:30 shift)
#   PN1  net_amount  -> Tier 2 LLM fallback  (no probe fingerprints business-logic drift;
#                        Claude proposes a hypothesis + confirming query, which promotes it)
#
# Fields mirror migration/scenarios.yaml, plus:
#   trace_root    the root table the lineage walk should reach (payments_raw)
#   trace_hops    expected hop count from the leaf to the root
#   defect_layer  the layer where the difference was actually injected
#   tier          which RCA tier is expected to conclude it

scenarios:
  - id: PT1
    table: payments_gold
    column: payment_ts
    recon_type: column_mismatch
    category: timezone
    verdict: migration_induced
    tier: deterministic
    deployed: true
    trace_root: payments_raw
    trace_hops: 2
    defect_layer: payments_enriched
    mechanism: >
      payment_ts shifted +5:30 with no UTC normalization in payments_enriched. A constant,
      known offset the temporal probe fingerprints deterministically — no LLM needed.

  - id: PN1
    table: payments_gold
    column: net_amount
    recon_type: column_mismatch
    category: transpilation           # business-logic drift; migration_induced verdict
    verdict: migration_induced
    tier: llm_fallback
    deployed: true
    example: {source: "492.66", target: "591.19"}   # gross 547.40: 0.90 vs 1.08
    trace_root: payments_raw
    trace_hops: 2
    defect_layer: payments_enriched
    mechanism: >
      net_amount recomputed as round(gross_amount * 1.08, 2) (8% tax) in payments_enriched,
      instead of the source rule round(gross_amount * 0.90, 2) (10% loyalty discount). Same
      DECIMAL scale, no rounding pattern, ratio ~0.83 (not a clean 10x/100x factor) -> the
      deterministic numeric probe fires nothing and the finding stays needs-review. The LLM
      fallback reads the sampled values + the migrated derivation, hypothesizes the +8% tax,
      writes a confirming query (target == round(gross*1.08,2)), runs it, and only then
      promotes the verdict to migration_induced.

# Clean controls (must produce NO finding):
#   customer_id, gross_amount, currency, status — untouched through every layer.
