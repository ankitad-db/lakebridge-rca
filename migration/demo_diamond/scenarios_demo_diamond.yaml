# Ground-truth oracle for the DEMO DIAMOND bed.
#
# Two recon runs (one per leaf) share this oracle:
#   orders_src -> orders_gold_c   (LEAF E, arm C)
#   orders_src -> orders_gold_d   (LEAF F, arm D)
#
# Validate each with:
#   python scripts/validate_scenarios.py --recon-id <recon_id> \
#     --warehouse-id <wid> --recon-schema reconcile \
#     --scenarios migration/demo_diamond/scenarios_demo_diamond.yaml --use-lineage
#
# Fields mirror migration/scenarios.yaml, plus:
#   trace_root    the root table the lineage walk should reach (orders_raw)
#   trace_hops    expected hop count from the leaf to the root
#   defect_layer  the layer where the difference was actually injected

scenarios:
  # ── LEAF E (orders_gold_c, arm C) ────────────────────────────────────────────
  - id: DC1
    table: orders_gold_c
    column: amount
    recon_type: column_mismatch
    category: type_precision
    verdict: migration_induced
    deployed: true
    example: {source: "21.7777", target: "21.78"}
    trace_root: orders_raw
    trace_hops: 3
    defect_layer: orders_enriched
    mechanism: >
      amount cast from NUMBER(18,4) to DECIMAL(18,2) in the shared enrichment layer
      (orders_enriched), losing the 3rd/4th decimals. Passed through curated_c -> gold_c
      unchanged; the defect is 2 hops upstream. Same root cause also drives DD1 on the
      other leaf (clustering).

  - id: DC2
    table: orders_gold_c
    column: order_ts
    recon_type: column_mismatch
    category: timezone
    verdict: migration_induced
    deployed: true
    trace_root: orders_raw
    trace_hops: 3
    defect_layer: orders_enriched
    mechanism: >
      order_ts shifted +5:30 with no UTC normalization in orders_enriched (shared).
      Same root cause as DD2 -> clusters across both leaves.

  - id: DC3
    table: orders_gold_c
    column: sku
    recon_type: column_mismatch
    category: string_format
    verdict: migration_induced
    deployed: true
    example: {source: "SKU-0007", target: "sku-0007 "}
    trace_root: orders_raw
    trace_hops: 3
    defect_layer: orders_curated_c
    mechanism: >
      sku lower-cased with a trailing space in orders_curated_c (arm C only). Defect is
      1 hop upstream. Must NOT appear on the arm-D leaf (distractor isolation).

  # ── LEAF F (orders_gold_d, arm D) ────────────────────────────────────────────
  - id: DD1
    table: orders_gold_d
    column: amount
    recon_type: column_mismatch
    category: type_precision
    verdict: migration_induced
    deployed: true
    example: {source: "21.7777", target: "21.78"}
    trace_root: orders_raw
    trace_hops: 3
    defect_layer: orders_enriched
    mechanism: shared amount scale-loss from orders_enriched (same root as DC1).

  - id: DD2
    table: orders_gold_d
    column: order_ts
    recon_type: column_mismatch
    category: timezone
    verdict: migration_induced
    deployed: true
    trace_root: orders_raw
    trace_hops: 3
    defect_layer: orders_enriched
    mechanism: shared +5:30 timezone shift from orders_enriched (same root as DC2).

  - id: DD3
    table: orders_gold_d
    recon_type: missing_in_target
    category: volume_missing
    verdict: migration_induced
    deployed: true
    mechanism: >
      load watermark in orders_curated_d drops order_id > 470 (30 rows never land).
      Arm D only; the arm-C leaf has all rows.

# Clean controls (must produce NO finding on either leaf):
#   customer_id, status, region  — untouched through every layer.
#   sku on orders_gold_d         — arm D leaves sku unchanged (proves arm-C isolation).
# These are verified by eye / by the table-level clean check, not listed as scenarios
# because each leaf legitimately has other findings.
