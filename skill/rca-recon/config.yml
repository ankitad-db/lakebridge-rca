# Configuration for the rca-recon skill. The user supplies only the recon_id;
# everything else is read from here.

# Where Lakebridge reconcile writes its output tables (main/metrics/details).
recon_catalog: fevm_ps_dr_us_east_2_catalog
recon_schema: reconcile

# The ORIGINAL source EDW dialect, used to pick the semantic knowledge base
# (type mappings, function differences, remediation). This RCA is NOT Snowflake-only:
# it works for any Lakebridge-supported source. Knowledge bases ship for:
#   snowflake, oracle, teradata, mssql (SQL Server), synapse
# (add more as rca_engine/knowledge/<dialect>.yaml). Unknown dialects still run with
# generic probes; they just get no dialect-specific remediation text.
dialect: snowflake

# Default schemas (within recon_catalog) for the reconcile step — used only when the
# user asks the skill to reconcile tables (no recon_id yet). The RCA-only path (an
# existing recon_id) ignores these. Reconcile compares source_schema vs target_schema
# and writes a fresh recon_id into recon_catalog.recon_schema.
source_schema: mig_source_sim
target_schema: mig_target

# Append-only audit trail. Each reconcile / RCA step logs one row (grouped by run_id)
# so there's a durable record of what ran, when, by whom, and the outcome. Defaults to
# <recon_catalog>.<recon_schema>.rca_genie_audit; set a fully-qualified name to relocate
# or "off" to disable. The runner needs CREATE TABLE + MODIFY on the containing schema
# (auto-created on first write; best-effort — auditing never blocks the RCA).
audit_table: ""

# Optional: SQL warehouse for local/CLI runs. Inside Genie Code the notebook's
# spark session is used, so this is not required there.
warehouse_id: 4c79c6902dd2bbc2

# Where to write the generated RCA notebook + JSON. The user can override this per
# run (just tell the skill where to save).
#   - A bare folder name (default) is created under the current user's workspace
#     home: /Workspace/Users/<current_user>/<folder>  (durable, per-user).
#   - An absolute path is used as-is, e.g.:
#       /Volumes/<catalog>/<schema>/<vol>   (Unity Catalog volume)
#       /Workspace/Shared/rca               (shared workspace folder)
#       /tmp                                (driver-local, ephemeral)
output_dir: rca_notebooks

# Output layout: each run writes a self-contained folder under output_dir:
#   <output_dir>/rca_<recon_id>/
#       00_index.ipynb        master overview + per-table routing (multi-table runs)
#       rca_<recon_id>.json   full machine-readable findings
#       <table>.ipynb         one self-contained notebook per reconciled table
# Set combined_notebook: true to ALSO write a single-scroll rca_<recon_id>_all.ipynb
# containing every table's findings in one book. Default: false (the index + per-table
# notebooks are the recommended navigation).
combined_notebook: false

# The deterministic engine (rca_engine) is vendored inside this skill folder, so
# it imports directly from the workspace — no external package install is needed.

# Optional: Lakebridge workflow artifacts for CODE-AWARE RCA (confirms cause from
# the code, not just data). All optional; omit for pure data-driven RCA.
#   recon_config_path:     Lakebridge reconcile config JSON (join keys, mappings, filters) = the mapping
#   transpiled_output_dir: TARGET scripts — transpiled Databricks SQL (lakebridge transpile --output-folder)
#   source_scripts_dir:    SOURCE scripts — original-dialect DDL (declared source types, e.g. NUMBER(18,4))
#   transpile_error_file:  Lakebridge transpile error report (transpile --error-file-path)
# recon_config_path: /Workspace/Users/<you>/lakebridge/recon_config.json
# transpiled_output_dir: /Workspace/Users/<you>/lakebridge/transpiled
# source_scripts_dir: /Workspace/Users/<you>/lakebridge/source_sql
# transpile_error_file: /Workspace/Users/<you>/lakebridge/transpile_errors.log

# Optional: explicit PER-TABLE script manifest (most robust — removes any file<->table
# ambiguity of the folder scans above). Point each target table at its own source and
# migrated (target) SQL. Overrides the folder scans for the tables listed.
#
# A ready-made example for the bundled pilot migration lives at
# migration/pilot/table_manifest.yml (6 core tables, Snowflake source <-> Databricks
# target). Copy its `tables:` block here, or upload the pilot scripts and point the
# folder scans at them instead:
#   source_scripts_dir:    <.../pilot/source_snowflake>   # authentic Snowflake DDL
#   transpiled_output_dir: <.../pilot/target_databricks>  # migrated Databricks scripts
#
# tables:
#   - target: fact_orders
#     source: FACT_ORDERS                 # optional; defaults to target
#     source_script: .../pilot/source_snowflake/fact_orders.sql   # declared source types
#     target_script: .../pilot/target_databricks/fact_orders.sql  # migrated transform
#     join_keys: [order_id]               # optional override
#     date_column: order_ts               # optional override

# Code-aware artifact (migrated Databricks SQL) for the transformation-logic highlight and
# the agentic reconstruction. Point this at your migration's transpiled/target SQL folder.
# (Default here = the hybrid retail demo bed.) Override per run with the transpiled_output_dir
# argument to run() when analyzing a different migration.
transpiled_output_dir: /Workspace/Users/ankita.darekar@databricks.com/.assistant/skills/rca-recon/demo_artifacts/det

# Agentic (LLM) vs deterministic is a per-run CHOICE, defaulted here:
#   llm_synthesis  drives the interactive Genie agentic tier (agent proposes + query-confirms);
#   llm_endpoint   drives the headless equivalent (a job) — see run()'s llm_endpoint argument.
# Currently set to PURELY DETERMINISTIC (Tier-1 only, no LLM). For the hybrid/agentic bed,
# flip llm_synthesis: true + llm_endpoint: databricks-claude-opus-5 and point
# transpiled_output_dir at .../demo_artifacts/hybrid (one config, change per run).
llm_synthesis: false
llm_endpoint: ""

# Optional: use Unity Catalog lineage (system.access.column_lineage / table_lineage)
# as an extra evidence source — confirms a column's true upstream provenance and the
# upstream tables feeding a target (helps locate where a volume/drift cause entered).
# Requires lineage to have been captured for the target tables + query access; degrades
# gracefully to nothing if unavailable. Off by default.
#
# When on, each finding also gets a DEPTH-AGNOSTIC upstream trace-back: lineage is walked
# hop by hop (column lineage where a column is known, table lineage otherwise) to the root
# layer, so a defect that entered several layers upstream (e.g. an intermediate staging /
# transform table) is pointed at directly — not just the reconciled target.
use_uc_lineage: true

# Max depth of the lineage trace-back walk (safety budget against very deep / cyclic
# graphs). Increase for deeper pipelines; the walk stops early at the roots anyway.
max_lineage_hops: 10

# Optional: JOB-LEVEL source-column trace. Reconciliation works at the table level; this
# goes one level up to the ETL JOB that builds the target. For each column mismatch it
# finds that job (from system.access.table_lineage, or set job_id below), exports its
# notebook SQL, parses it with sqlglot, and traces the mismatching column back to its TRUE
# source columns (the transform at every hop) — then attaches a runnable reproduction query
# that recomputes the value from source for the sampled row. Complements use_uc_lineage
# (UC metadata) with the actual SQL-derived "why". Needs the Databricks SDK + workspace
# access; degrades gracefully to nothing if unavailable. Off by default.
trace_job: false

# Pin the building job (id or name) for trace_job when system-table discovery isn't
# available; leave blank to auto-discover from lineage.
# job_id:

# Distribution-drift quantification. For every column mismatch, measure the source-vs-
# target null-rate, cardinality, and numeric summary (min/max/mean/stddev) and report
# the shift — a stable distribution points to a migration/precision cause, a material
# shift (null-rate jump / cardinality change) points to a genuine upstream data change.
# One extra live query per column finding; on by default, set false to skip.
distribution_drift: true

# Downstream blast radius. For each AFFECTED target table (one with an actionable
# finding), list the UC tables that consume it so a fix is prioritized by how far the
# defect propagates. Reads system.access.table_lineage (same access as use_uc_lineage);
# defaults to whatever use_uc_lineage is set to. Set true/false to force it independently.
# blast_radius: false

# Learning loop (memory). When on, the skill (a) loads priors from previously CONFIRMED
# runs before analysis and proposes a matching recurring cause (which the drill-down then
# confirms — never promoted on memory alone), and (b) after the run, records every
# query-confirmed cause into an append-only Delta table keyed by a mechanism signature
# (dialect + category + translated functions / scale delta). So the same mistranslation or
# scale loss auto-classifies on the next migration. Needs CREATE TABLE + MODIFY on the
# containing schema (best-effort; never blocks the RCA). Off by default.
#   memory_table: defaults to <recon_catalog>.<recon_schema>.rca_genie_memory; set a
#                 fully-qualified name to relocate, or "off" to disable.
use_memory: false
memory_table: ""

# Suggested fixes. Attach a concrete, runnable remediation to each finding whose
# category has one — the corrected transform expression (widen a cast, normalize a
# timezone, align TRIM/case, explicit NULL/boolean mapping), a load statement
# (back-fill missing rows, de-duplicate extras), or a recon-config normalization.
# Deterministic and always a SUGGESTION (rendered as a review-then-run cell; never
# auto-applied). On by default; set false to omit the fix cells.
suggest_fixes: true

# Scan scoping — keep the LIVE confirming / drift / fix-validation queries cheap on large
# tables. The deterministic first pass and the sampled example rows are already cheap (they
# read the pre-computed recon output); these knobs bound the queries that would otherwise
# aggregate over the full source and target.
#   scoped (default): a column confirm re-checks only the reconciliation-FLAGGED keys
#                     (IN (...) push-down), and full-table aggregates (drift, watermark,
#                     distinct counts) are restricted to the partition/date window below.
#                     Exact — the true total mismatch count still comes from recon metrics.
#   full            : original behavior — unbounded full-table scans.
scan_mode: scoped
# Optional partition/date column present on BOTH source and target; when set with a range,
# drift/volume aggregates read just that window instead of full history. Leave blank to skip.
scan_partition_column: ""
scan_date_start: ""      # e.g. "2024-01-01"
scan_date_end: ""        # e.g. "2024-01-31"
# Cap on how many flagged keys go into a confirming IN (...) predicate (keeps SQL bounded).
scan_max_keys: 500

# Fix-validation gate. When on, each suggested fix's validation query is executed to
# check the reconciliation gap is *entirely* explained by the mechanism the fix corrects
# (e.g. the whole diff is scale rounding / trim-case / a constant TZ offset / duplicate
# keys / missing keys). Fixes that pass are marked "✅ validated"; the rest stay
# unvalidated suggestions. Same evidence-first discipline as verdicts — nothing is
# presented as trusted unless a query confirms it. On by default.
validate_fixes: true

# LLM synthesis layer (interactive Genie Code only). When on, after the deterministic
# analyze() the agent (a) authors a GROUNDED plain-English "Analyst summary" — overall +
# per table — from the concluded findings (rca_engine.synthesize.build_narrative_context
# → set_narrative), and (b) proposes + executes adaptive drill-down queries for the
# findings resolve.needs_query() flags (generic/residual), promoting a verdict ONLY when
# the query confirms (resolve.resolve_finding). Verdicts stay deterministic + query-gated;
# this only adds description and widens query coverage. Narrative is always labeled as LLM
# synthesis, never presented as evidence. It's advisory: the interactive agent reads
# SKILL.md; headless runs (no agent) simply skip it and render today's deterministic report.
llm_synthesis: true
